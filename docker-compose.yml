services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: emergency-blood-api
    # Host port (HOST_PORT, default 1000) -> container port 8080
    ports:
      - "${HOST_PORT:-1000}:8080"
    env_file:
      - .env
    environment:
      PORT: "8080"
      ENV: production
      # The key is mounted read-only at runtime and never baked into the image
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/service_account.json
    volumes:
      - ./service_account.json:/run/secrets/service_account.json:ro
    restart: unless-stopped
    networks:
      - blood-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  blood-network:
    driver: bridge
